<form [formGroup]="voteForm" (ngSubmit)="onSubmit()">
  <input type="text" formControlName="voteId" placeholder="Vote ID">
  <input type="email" formControlName="email" placeholder="Email">
  <input type="text" formControlName="category" placeholder="Category">

  <select formControlName="cricketerId">
    <option value="">Select Cricketer</option>
    <!-- Use c.cricketerId to match the model -->
    <option *ngFor="let c of cricketers" [value]="c.cricketerId">{{c.cricketerName}}</option>
  </select>

  <select formControlName="teamId">
    <option value="">Select Team</option>
    <!-- Use t.teamId to match the model -->
    <option *ngFor="let t of teams" [value]="t.teamId">{{t.teamName}}</option>
  </select>
  
  <button type="submit">Vote</button>

  <!-- Ensure these IDs/classes match if the test looks for specific elements -->
  <div *ngIf="successMessage" class="success-message">{{successMessage}}</div>
  <div *ngIf="errorMessage" class="error-message">{{errorMessage}}</div>
</form>
