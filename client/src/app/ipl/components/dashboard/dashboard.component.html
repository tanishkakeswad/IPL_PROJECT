<div class="container mt-4">
  <h2>Admin Dashboard</h2>

  <!-- Teams Table -->
  <section class="mt-4">
    <h3>Teams</h3>
    <table class="table table-striped">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Location</th><th>Owner</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of teams">
          <td>{{t.teamId}}</td><td>{{t.teamName}}</td><td>{{t.location}}</td><td>{{t.ownerName}}</td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- Cricketers Table -->
  <section class="mt-4">
    <h3>Cricketers</h3>
    <table class="table table-striped">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Age</th><th>Team</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of cricketers">
          <td>{{c.cricketerId}}</td><td>{{c.cricketerName}}</td><td>{{c.age}}</td><td>{{c.team?.teamName}}</td>
        </tr>
      </tbody>
    </table>
  </section>

  <!-- Matches Table -->
  <section class="mt-4">
    <h3>Matches</h3>
    <table class="table table-striped">
      <thead>
        <tr><th>ID</th><th>Date</th><th>Venue</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of matches">
          <td>{{m.matchId}}</td><td>{{m.matchDate | date:'mediumDate'}}</td><td>{{m.venue}}</td>
        </tr>
      </tbody>
    </table>
  </section>
</div>
