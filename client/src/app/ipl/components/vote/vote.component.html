<div class="vote-container">
  <h2>Cast Your Vote</h2>
  <form [formGroup]="voteForm" (ngSubmit)="onSubmit()">
    <input type="number" formControlName="voteId" placeholder="Vote ID">
    <input type="email" formControlName="email" placeholder="Email">
    <input type="text" formControlName="category" placeholder="Category">
    <input type="number" formControlName="cricketerId" placeholder="Cricketer ID">
    <input type="number" formControlName="teamId" placeholder="Team ID">

    <button type="submit" [disabled]="voteForm.invalid">Submit Vote</button>
    <button type="button" (click)="resetForm()">Reset</button>
  </form>

  <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
</div>
