<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">IPL Hub</h2>
        <p class="text-muted">{{ isLoginMode ? 'Welcome Back!' : 'Create an Account' }}</p>
      </div>

      <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
        <!-- Email Input -->
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control form-control-lg" formControlName="email" 
                 placeholder="name@example.com" [class.is-invalid]="authForm.get('email')?.invalid && authForm.get('email')?.touched">
        </div>

        <!-- Password Input -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control form-control-lg" formControlName="password" 
                 placeholder="••••••••">
        </div>

        <!-- Role Selection (For Demo/Project Purposes) -->
        <div class="mb-4">
          <label class="form-label">Login As</label>
          <select class="form-select" formControlName="role">
            <option value="USER">Fan (User)</option>
            <option value="ADMIN">Administrator</option>
          </select>
        </div>

        <!-- Action Buttons -->
        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" [disabled]="!authForm.valid">
          {{ isLoginMode ? 'Login' : 'Sign Up' }}
        </button>

        <div class="text-center">
          <a href="javascript:void(0)" (click)="onSwitchMode()" class="text-decoration-none small">
            {{ isLoginMode ? "Don't have an account? Sign Up" : "Already have an account? Login" }}
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
