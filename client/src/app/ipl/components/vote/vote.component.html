<form [formGroup]="voteForm" (ngSubmit)="onSubmit()">
  <input type="text" formControlName="voteId" placeholder="Vote ID">
  <input type="email" formControlName="email" placeholder="Email">
  <input type="text" formControlName="category" placeholder="Category">

  <select formControlName="cricketerId">
    <option value="">Select Cricketer</option>
    <option *ngFor="let c of cricketers" [value]="c.id">{{c.cricketerName}}</option>
  </select>

  <select formControlName="teamId">
    <option value="">Select Team</option>
    <option *ngFor="let t of teams" [value]="t.id">{{t.teamName}}</option>
  </select>
  
  <button type="submit">Vote</button>

  <div *ngIf="successMessage">{{successMessage}}</div>
  <div *ngIf="errorMessage">{{errorMessage}}</div>
</form>
